server:
  port: 8083

spring:
  application:
    name: tc-oficina-execution-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://execution-mongo:27017/oficina_execution}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.oficina-infra.svc.cluster.local:9092}
    consumer:
      group-id: execution-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    config-url: /execution/v3/api-docs/swagger-config
    url: /execution/v3/api-docs
