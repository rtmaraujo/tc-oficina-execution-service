apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: execution-service-ingressroute
  namespace: oficina-execution
spec:
  entryPoints:
    - web
  routes:
    - match:  PathPrefix(`/execution`)
      kind: Rule
      services:
        - name: tc-oficina-execution-service
          port: 8083
      middlewares:
        - name: strip-execution-prefix
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-execution-prefix
  namespace: oficina-execution
spec:
  stripPrefix:
    prefixes:
      - /execution
