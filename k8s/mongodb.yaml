apiVersion: v1
kind: Service
metadata:
  name: execution-mongo
  namespace: oficina-execution
  labels:
    app: execution-mongo
spec:
  clusterIP: None
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
  selector:
    app: execution-mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: execution-mongo
  namespace: oficina-execution
spec:
  serviceName: execution-mongo
  replicas: 1
  selector:
    matchLabels:
      app: execution-mongo
  template:
    metadata:
      labels:
        app: execution-mongo
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
