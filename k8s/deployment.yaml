apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc-oficina-execution-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tc-oficina-execution-service
  template:
    metadata:
      labels:
        app: tc-oficina-execution-service
    spec:
      containers:
      - name: tc-oficina-execution-service
        image: tc-oficina-execution-service:latest
        ports:
        - containerPort: 8083
        envFrom:
        - configMapRef:
            name: execution-service-config
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
