apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc-oficina-execution-service
  namespace: oficina-execution
  labels:
    app: tc-oficina-execution-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tc-oficina-execution-service
  template:
    metadata:
      labels:
        app: tc-oficina-execution-service
    spec:
      containers:
        - name: tc-oficina-execution-service
          image: 097735115452.dkr.ecr.us-west-2.amazonaws.com/tc-oficina-execution-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: execution-service-config
            - secretRef:
                name: execution-service-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
